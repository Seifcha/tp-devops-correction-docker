name: CI devops 2025

on:
  # Le workflow se lance sur les push vers main et develop
  push:
    branches: [ main, develop ]
  # ... et sur toutes les pull requests
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # 1. Récupère le code du dépôt sur le runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installe le JDK 21 (distribution Temurin) + cache Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compile, lance les tests unitaires + d'intégration (Testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml
